# Phục vụ: bản web (Godot, đa luồng cần COOP/COEP), gói nội dung tải ngầm /content/, APK /download/, WebSocket /ws -> mu-gateway.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream pck;
    }

    # Bắt buộc cho Godot 4 Web đa luồng (SharedArrayBuffer).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    location /t/ { return 204; }   # nhịp tim chẩn đoán từ client (chỉ để lọt vào access log)
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # --- Kênh game: trình duyệt / app nói chuyện qua WebSocket nhị phân tới mu-gateway ---
    location /ws {
        proxy_pass http://mu-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Gói nội dung (đã đặt tên theo mã băm nên bất biến) ---
    location ^~ /content/packs/ {
        alias /srv/content/packs/;
        gzip off;                       # .pck đã nén; tải tiếp (Range) hoạt động mặc định
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        sendfile on;
        tcp_nopush on;
        sendfile_max_chunk 2m;
    }
    location = /content/manifest.json {
        gzip off;                       # Godot web tự giải nén gzip lần nữa -> lỗi
        alias /srv/content/manifest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # --- Tải APK ---
    location /download/ {
        alias /srv/download/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Disposition "attachment" always;
    }

    # --- Bản web: index.html luôn lấy mới, wasm/pck cache lâu (Godot đổi tên file khi build mới thì đổi cả index.html) ---
    location = /index.service.worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
    location ~* \.(?:wasm|pck)$ {
        add_header Cache-Control "no-cache" always;     # luôn hỏi lại (ETag) vì tên file cố định index.*
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
